name: Build Unobfuscated Release APK

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Branch, tag, or commit SHA to build (e.g. master or 7be672ead283d022812d75c729d3a04dd4c2a2c6)'
        required: false
        default: 'master'
        type: string
      variants:
        description: 'Comma-separated variants to build: release (org.telegram.messenger), web (org.telegram.messenger.web), or release,web'
        required: false
        default: 'release,web'
        type: string
      abi_filters:
        description: 'Comma-separated ABIs (e.g. arm64-v8a or armeabi-v7a,arm64-v8a,x86,x86_64)'
        required: false
        default: 'arm64-v8a'
        type: string
      unobfuscated:
        description: 'Disable R8/ProGuard obfuscation and resource shrinking (minifyEnabled=false)'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish APK and SHA256 checksum to GitHub Releases'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Optional Release tag override (default: v<VERSION_NAME>-<VERSION_CODE>)'
        required: false
        default: ''
        type: string

  workflow_call:
    inputs:
      git_ref:
        description: 'Branch, tag, or commit SHA to build'
        required: false
        default: 'master'
        type: string
      variants:
        description: 'Comma-separated variants: release, web, or release,web'
        required: false
        default: 'release,web'
        type: string
      abi_filters:
        description: 'Comma-separated ABIs'
        required: false
        default: 'arm64-v8a'
        type: string
      unobfuscated:
        description: 'Disable R8/ProGuard obfuscation and resource shrinking'
        required: false
        default: true
        type: boolean
      publish_release:
        description: 'Publish APK to GitHub Releases'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Optional Release tag override'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: build-apk-${{ inputs.git_ref || github.sha }}-${{ inputs.variants || 'release,web' }}-${{ inputs.abi_filters || 'arm64-v8a' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK (${{ inputs.variants || 'release,web' }} / ${{ inputs.abi_filters || 'arm64-v8a' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Resolve target commit SHA
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          RAW_REF: ${{ inputs.git_ref || 'master' }}
        run: |
          set -euo pipefail
          RESOLVED_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RAW_REF}" --jq '.sha')
          SHORT_SHA="${RESOLVED_SHA:0:10}"
          echo "sha=${RESOLVED_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved ref '${RAW_REF}' -> ${RESOLVED_SHA}"

      - name: Checkout repository at target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 1
          submodules: false

      - name: Initialize Git submodules (resilient shallow with fallback)
        run: |
          set -euo pipefail
          git submodule sync --recursive
          if ! git submodule update --init --recursive --depth=1 --jobs=4; then
            echo "Bulk shallow submodule init hit a pinned commit; falling back per-submodule..."
            git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read -r sub_path; do
              echo "Initializing submodule: ${sub_path}"
              if ! git submodule update --init --recursive --depth=1 -- "${sub_path}"; then
                echo "Shallow init failed for ${sub_path}, retrying full fetch..."
                git submodule update --init --recursive -- "${sub_path}"
              fi
            done
          fi
          echo "=== Submodule status ==="
          git submodule status --recursive
          if git submodule status --recursive | grep -q '^-'; then
            echo "::error::One or more submodules failed to initialize!"
            exit 1
          fi

      - name: Parse version and toolchain metadata
        id: meta
        env:
          VARIANTS: ${{ inputs.variants || 'release,web' }}
          ABI_FILTERS: ${{ inputs.abi_filters || 'arm64-v8a' }}
          UNOBFUSCATED: ${{ inputs.unobfuscated }}
          RELEASE_TAG_OVERRIDE: ${{ inputs.release_tag || '' }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          props_text = pathlib.Path('gradle.properties').read_text(encoding='utf-8')
          props = {}
          for line in props_text.splitlines():
              line = line.strip()
              if not line or line.startswith('#') or '=' not in line:
                  continue
              k, v = line.split('=', 1)
              props[k.strip()] = v.strip()

          version_name = props['APP_VERSION_NAME']
          version_code = props['APP_VERSION_CODE']
          app_package = props.get('APP_PACKAGE', 'org.telegram.messenger')

          lib_gradle = pathlib.Path('TMessagesProj/build.gradle').read_text(encoding='utf-8')
          m_sdk = re.search(r'compileSdk(?:Version)?\s*[=]?\s*(\d+)', lib_gradle)
          m_bt = re.search(r'buildToolsVersion\s*[=]?\s*[\'"]([^\'"]+)[\'"]', lib_gradle)
          m_ndk = re.search(r'ndkVersion\s*[=]?\s*[\'"]([^\'"]+)[\'"]', lib_gradle)
          m_cmake = re.search(r'cmake\s*\{[^}]*version\s*[\'"]([^\'"]+)[\'"]', lib_gradle, re.S)

          compile_sdk = m_sdk.group(1) if m_sdk else '36'
          build_tools = m_bt.group(1) if m_bt else '36.0.0'
          ndk_version = m_ndk.group(1) if m_ndk else '27.2.12479018'
          cmake_version = m_cmake.group(1) if m_cmake else '3.22.1'

          jdk_version = '17'
          dockerfile = pathlib.Path('Dockerfile')
          if dockerfile.exists():
              m_jdk = re.search(r'jdk(\d+)', dockerfile.read_text(encoding='utf-8'))
              if m_jdk:
                  jdk_version = m_jdk.group(1)

          variants = [v.strip().lower() for v in os.environ['VARIANTS'].split(',') if v.strip()]
          valid_variants = {'release', 'web'}
          assert variants and all(v in valid_variants for v in variants), f'Invalid VARIANTS={variants}; allowed: release, web'
          build_release = 'release' in variants
          build_web = 'web' in variants

          abis = [a.strip() for a in os.environ['ABI_FILTERS'].split(',') if a.strip()]
          abi_tag = 'afat' if len(abis) > 1 else abis[0]
          unobf = os.environ.get('UNOBFUSCATED', 'true').lower() != 'false'
          obf_suffix = 'unobfuscated' if unobf else 'obfuscated'

          release_tag = os.environ.get('RELEASE_TAG_OVERRIDE', '').strip() or f'v{version_name}-{version_code}'
          release_apk_name = f'Telegram-v{version_name}-{version_code}-{abi_tag}-{obf_suffix}.apk'
          web_apk_name = f'Telegram-web-v{version_name}-{version_code}-{abi_tag}-{obf_suffix}.apk'

          out = {
              'version_name': version_name,
              'version_code': version_code,
              'app_package': app_package,
              'compile_sdk': compile_sdk,
              'build_tools': build_tools,
              'ndk_version': ndk_version,
              'cmake_version': cmake_version,
              'jdk_version': jdk_version,
              'abi_tag': abi_tag,
              'need_nasm': 'true' if any(a in ('x86', 'x86_64') for a in abis) else 'false',
              'build_release': 'true' if build_release else 'false',
              'build_web': 'true' if build_web else 'false',
              'release_tag': release_tag,
              'release_apk_name': release_apk_name,
              'web_apk_name': web_apk_name,
          }

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
                  print(f'{k}={v}')
          PY

      - name: Set up JDK ${{ steps.meta.outputs.jdk_version }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ steps.meta.outputs.jdk_version }}

      - name: Set up Android SDK, NDK, and CMake
        env:
          COMPILE_SDK: ${{ steps.meta.outputs.compile_sdk }}
          BUILD_TOOLS: ${{ steps.meta.outputs.build_tools }}
          NDK_VERSION: ${{ steps.meta.outputs.ndk_version }}
          CMAKE_VERSION: ${{ steps.meta.outputs.cmake_version }}
          NEED_NASM: ${{ steps.meta.outputs.need_nasm }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(command -v sdkmanager || find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: ${SDKMANAGER}"

          # Remove unused preinstalled NDK versions to save disk space
          if [ -d "${SDK_ROOT}/ndk" ]; then
            for d in "${SDK_ROOT}/ndk"/*; do
              [ -d "$d" ] || continue
              if [ "$(basename "$d")" != "${NDK_VERSION}" ]; then
                echo "Removing unused preinstalled NDK: $d"
                sudo rm -rf "$d"
              fi
            done
          fi

          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

          if [ "${NEED_NASM}" = "true" ]; then
            sudo apt-get update -y
            sudo apt-get install -y nasm
          fi

          echo "=== Disk after SDK setup ==="
          df -h /

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'TMessagesProj/build.gradle', 'TMessagesProj_App/build.gradle', 'TMessagesProj_AppStandalone/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure optional custom keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > TMessagesProj/config/release.keystore
            echo "custom=true" >> "$GITHUB_OUTPUT"
            echo "Using custom release.keystore from repository Secrets."
          else
            echo "custom=false" >> "$GITHUB_OUTPUT"
            echo "Using repository built-in release.keystore."
          fi

      - name: Patch Gradle config for unobfuscated build & target ABIs (CI only)
        env:
          BUILD_RELEASE: ${{ steps.meta.outputs.build_release }}
          BUILD_WEB: ${{ steps.meta.outputs.build_web }}
          ABI_FILTERS: ${{ inputs.abi_filters || 'arm64-v8a' }}
          UNOBFUSCATED: ${{ inputs.unobfuscated }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          unobf = os.environ.get('UNOBFUSCATED', 'true').lower() != 'false'
          build_release = os.environ.get('BUILD_RELEASE', 'true').lower() == 'true'
          build_web = os.environ.get('BUILD_WEB', 'true').lower() == 'true'
          abis = [a.strip() for a in os.environ['ABI_FILTERS'].split(',') if a.strip()]
          assert abis, 'ABI_FILTERS must not be empty'
          abi_groovy = ', '.join(f'"{a}"' for a in abis)
          abi_re = re.compile(r'abiFilters\s+"[^"\n]+"(?:\s*,\s*"[^"\n]+")*')

          def patch_block(m):
              blk = m.group(0)
              blk = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', blk)
              blk = re.sub(r'shrinkResources\s+true', 'shrinkResources false', blk)
              return blk

          def patch_app_module(gradle_file, block_name, expect_suffix=None):
              p = pathlib.Path(gradle_file)
              text = p.read_text(encoding='utf-8')
              if unobf:
                  block_re = re.compile(
                      rf'\b{block_name}\s*\{{[^{{}}]*?signingConfig\s+signingConfigs\.release[^{{}}]*?\}}',
                      re.S,
                  )
                  text, count = block_re.subn(patch_block, text, count=1)
                  if count != 1:
                      raise RuntimeError(f'Expected 1 buildTypes.{block_name} block in {gradle_file}, matched {count}')
                  m = block_re.search(text)
                  assert m and 'debuggable false' in m.group(0), f'{gradle_file} {block_name} missing debuggable false!'
                  assert 'minifyEnabled false' in m.group(0), f'{gradle_file} {block_name} missing minifyEnabled false!'
                  assert 'shrinkResources false' in m.group(0), f'{gradle_file} {block_name} missing shrinkResources false!'
                  assert 'minifyEnabled true' not in m.group(0), f'{gradle_file} {block_name} still has minifyEnabled true!'
                  assert 'shrinkResources true' not in m.group(0), f'{gradle_file} {block_name} still has shrinkResources true!'
                  if expect_suffix:
                      assert f'applicationIdSuffix "{expect_suffix}"' in m.group(0), f'{gradle_file} missing applicationIdSuffix "{expect_suffix}"'

              text, abi_count = abi_re.subn(f'abiFilters {abi_groovy}', text)
              assert abi_count >= 1, f'Failed to locate abiFilters in {gradle_file}'
              p.write_text(text, encoding='utf-8')

          # 1. Patch app module(s)
          if build_release:
              patch_app_module('TMessagesProj_App/build.gradle', 'release')
          if build_web:
              patch_app_module('TMessagesProj_AppStandalone/build.gradle', 'standalone', expect_suffix='.web')

          # 2. Restrict CMake/NDK ABIs in library module TMessagesProj/build.gradle so unused ABIs are not compiled
          lib_path = pathlib.Path('TMessagesProj/build.gradle')
          lib_text = lib_path.read_text(encoding='utf-8')
          if 'abiFilters' not in lib_text:
              lib_re = re.compile(r'(defaultConfig\s*\{[\s\S]*?multiDexEnabled\s+true)', re.S)
              lib_text, lib_count = lib_re.subn(
                  rf'\1\n        ndk {{\n            abiFilters {abi_groovy}\n        }}',
                  lib_text,
                  count=1,
              )
              assert lib_count == 1, 'Failed to inject ndk abiFilters into TMessagesProj/build.gradle'
              lib_path.write_text(lib_text, encoding='utf-8')

          # 3. Tune gradle.properties for CI runner memory safety alongside lld -flto=full
          gp_path = pathlib.Path('gradle.properties')
          gp_text = gp_path.read_text(encoding='utf-8')
          gp_text = re.sub(r'^org\.gradle\.jvmargs=.*$', 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g', gp_text, flags=re.M)
          gp_text = re.sub(r'^org\.gradle\.daemon=.*$', 'org.gradle.daemon=false', gp_text, flags=re.M)
          gp_path.write_text(gp_text, encoding='utf-8')
          PY

          echo "=== CI-only Gradle patch diff ==="
          git diff -- TMessagesProj/build.gradle TMessagesProj_App/build.gradle TMessagesProj_AppStandalone/build.gradle gradle.properties

      - name: Build selected Gradle APK task(s)
        env:
          BUILD_RELEASE: ${{ steps.meta.outputs.build_release }}
          BUILD_WEB: ${{ steps.meta.outputs.build_web }}
          CUSTOM_SIGNING: ${{ steps.signing.outputs.custom }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          # Prepend Google's Maven Central mirror to avoid Maven Central 429 rate limits on shared CI runners
          cat > /tmp/maven-mirror.init.gradle <<'EOF'
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2"
          def prependMirrorIfNonEmpty = { RepositoryHandler repos ->
              if (repos.isEmpty()) {
                  return
              }
              def exists = repos.any {
                  it instanceof MavenArtifactRepository &&
                      it.url != null &&
                      it.url.toString().contains("maven-central.storage-download.googleapis.com")
              }
              if (!exists) {
                  def mirrorRepo = repos.maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri(mirrorUrl)
                  }
                  repos.remove(mirrorRepo)
                  repos.addFirst(mirrorRepo)
              }
          }

          gradle.settingsEvaluated { settings ->
              def pmRepos = settings.pluginManagement.repositories
              if (pmRepos.isEmpty()) {
                  pmRepos.gradlePluginPortal()
              }
              prependMirrorIfNonEmpty(pmRepos)
              if (settings.metaClass.respondsTo(settings, 'getDependencyResolutionManagement')) {
                  prependMirrorIfNonEmpty(settings.dependencyResolutionManagement.repositories)
              }
          }

          gradle.beforeProject { proj ->
              proj.buildscript.repositories.all { ArtifactRepository repo ->
                  if (repo instanceof MavenArtifactRepository) {
                      def u = repo.url?.toString() ?: ""
                      if (u.startsWith("https://repo.maven.apache.org/maven2") || u.startsWith("https://repo1.maven.org/maven2")) {
                          repo.url = uri(mirrorUrl)
                      }
                  }
              }
          }

          gradle.afterProject { proj ->
              prependMirrorIfNonEmpty(proj.repositories)
          }
          EOF

          TASKS=()
          [ "${BUILD_RELEASE}" = "true" ] && TASKS+=(":TMessagesProj_App:assembleAfatRelease")
          [ "${BUILD_WEB}" = "true" ] && TASKS+=(":TMessagesProj_AppStandalone:assembleAfatStandalone")
          echo "Gradle tasks: ${TASKS[*]}"

          EXTRA_ARGS=()
          if [ "${CUSTOM_SIGNING}" = "true" ]; then
            [ -n "${RELEASE_STORE_PASSWORD}" ] && EXTRA_ARGS+=("-PRELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}")
            [ -n "${RELEASE_KEY_ALIAS}" ] && EXTRA_ARGS+=("-PRELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}")
            [ -n "${RELEASE_KEY_PASSWORD}" ] && EXTRA_ARGS+=("-PRELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}")
          fi

          for attempt in 1 2; do
            if ./gradlew --init-script /tmp/maven-mirror.init.gradle "${TASKS[@]}" --no-daemon --stacktrace "${EXTRA_ARGS[@]}"; then
              break
            fi
            if [ "${attempt}" -eq 2 ]; then
              echo "::error::Gradle build failed after ${attempt} attempts."
              exit 1
            fi
            echo "Gradle build attempt ${attempt} failed; retrying once in 15s..."
            sleep 15
          done

      - name: Verify APK(s) (unobfuscated DEX gate, ABI, package, signature)
        id: verify
        env:
          BUILD_RELEASE: ${{ steps.meta.outputs.build_release }}
          BUILD_WEB: ${{ steps.meta.outputs.build_web }}
          RELEASE_APK_NAME: ${{ steps.meta.outputs.release_apk_name }}
          WEB_APK_NAME: ${{ steps.meta.outputs.web_apk_name }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APP_PACKAGE: ${{ steps.meta.outputs.app_package }}
          BUILD_TOOLS: ${{ steps.meta.outputs.build_tools }}
          ABI_FILTERS: ${{ inputs.abi_filters || 'arm64-v8a' }}
          UNOBFUSCATED: ${{ inputs.unobfuscated }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, struct, subprocess, zipfile

          dist_dir = pathlib.Path('dist')
          dist_dir.mkdir(parents=True, exist_ok=True)

          sdk_root = pathlib.Path(os.environ.get('ANDROID_HOME', '/usr/local/lib/android/sdk'))
          bt = os.environ['BUILD_TOOLS']
          aapt2 = str(sdk_root / 'build-tools' / bt / 'aapt2')
          apksigner = str(sdk_root / 'build-tools' / bt / 'apksigner')

          version_name = os.environ['VERSION_NAME']
          app_package = os.environ['APP_PACKAGE']
          expected_abis = {a.strip() for a in os.environ['ABI_FILTERS'].split(',') if a.strip()}
          unobf = os.environ.get('UNOBFUSCATED', 'true').lower() != 'false'

          targets = []
          if os.environ.get('BUILD_RELEASE', 'false').lower() == 'true':
              targets.append({
                  'key': 'release',
                  'label': 'Release',
                  'gradle_task': 'TMessagesProj_App:assembleAfatRelease',
                  'search_dir': pathlib.Path('TMessagesProj_App/build/outputs/apk/afat/release'),
                  'mapping_file': pathlib.Path('TMessagesProj_App/build/outputs/mapping/afatRelease/mapping.txt'),
                  'expected_pkg': app_package,
                  'out_name': os.environ['RELEASE_APK_NAME'],
              })
          if os.environ.get('BUILD_WEB', 'false').lower() == 'true':
              targets.append({
                  'key': 'web',
                  'label': 'Standalone (.web)',
                  'gradle_task': 'TMessagesProj_AppStandalone:assembleAfatStandalone',
                  'search_dir': pathlib.Path('TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone'),
                  'mapping_file': pathlib.Path('TMessagesProj_AppStandalone/build/outputs/mapping/afatStandalone/mapping.txt'),
                  'expected_pkg': f'{app_package}.web',
                  'out_name': os.environ['WEB_APK_NAME'],
              })

          def read_uleb128(buf, pos):
              res = 0
              shift = 0
              while True:
                  b = buf[pos]
                  pos += 1
                  res |= (b & 0x7F) << shift
                  if (b & 0x80) == 0:
                      break
                  shift += 7
              return res, pos

          summary = []
          for t in targets:
              apks = sorted(t['search_dir'].glob('*.apk'))
              assert apks, f"Built APK not found under {t['search_dir']}"
              out_apk = dist_dir / t['out_name']
              shutil.copy2(apks[0], out_apk)
              print(f"\n================ Verifying {t['label']}: {out_apk} ================")

              badging = subprocess.check_output([aapt2, 'dump', 'badging', str(out_apk)], text=True, encoding='utf-8', errors='replace')
              print('\n'.join(badging.splitlines()[:12]))
              assert f"package: name='{t['expected_pkg']}'" in badging, f"Package name mismatch for {t['label']}!"
              assert f"versionName='{version_name}'" in badging, f"versionName mismatch for {t['label']}!"
              assert 'application-debuggable' not in badging, f"{t['label']} APK must NOT be debuggable!"
              m_vc = re.search(r"versionCode='(\d+)'", badging)
              apk_version_code = m_vc.group(1) if m_vc else ''

              sign_out = subprocess.check_output([apksigner, 'verify', '--verbose', '--print-certs', str(out_apk)], text=True, encoding='utf-8', errors='replace')
              print(sign_out)
              m_cert = re.search(r'Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)', sign_out)
              cert_sha256 = m_cert.group(1) if m_cert else ''

              with zipfile.ZipFile(out_apk, 'r') as zf:
                  names = zf.namelist()
                  found_abis = set()
                  so_files = []
                  for n in names:
                      if n.startswith('lib/') and n.endswith('.so'):
                          parts = n.split('/')
                          if len(parts) >= 3:
                              found_abis.add(parts[1])
                              so_files.append(n)
                  print('Native libraries:', sorted(so_files))
                  assert found_abis == expected_abis, f"ABI mismatch for {t['label']}! expected={expected_abis}, found={found_abis}"
                  assert any('libtmessages.' in s for s in so_files), f"Missing libtmessages*.so in {t['label']}!"

                  dex_files = sorted(n for n in names if n.startswith('classes') and n.endswith('.dex'))
                  print('DEX files:', dex_files)
                  assert dex_files, f"No DEX files found in {t['label']}!"

                  tg_classes = set()
                  if unobf:
                      assert not t['mapping_file'].exists(), f"R8 mapping.txt exists at {t['mapping_file']} — {t['label']} was processed by R8!"
                      all_strings = set()
                      for dex_name in dex_files:
                          data = zf.read(dex_name)
                          assert data[:4] == b'dex\n', f'Invalid DEX header in {dex_name}'
                          str_size, str_off = struct.unpack_from('<II', data, 56)
                          for i in range(str_size):
                              s_off = struct.unpack_from('<I', data, str_off + i * 4)[0]
                              _, p = read_uleb128(data, s_off)
                              end = data.index(0, p)
                              s = data[p:end].decode('utf-8', errors='ignore')
                              all_strings.add(s)
                              if s.startswith('Lorg/telegram/') and s.endswith(';'):
                                  tg_classes.add(s)

                      print(f"Total unobfuscated Lorg/telegram/* descriptors in {t['label']}: {len(tg_classes)}")
                      required_classes = [
                          'Lorg/telegram/ui/ChatActivity;',
                          'Lorg/telegram/ui/DialogsActivity;',
                          'Lorg/telegram/ui/LaunchActivity;',
                          'Lorg/telegram/messenger/MessagesController;',
                          'Lorg/telegram/messenger/SendMessagesHelper;',
                          'Lorg/telegram/messenger/MessageObject;',
                      ]
                      missing_cls = [c for c in required_classes if c not in tg_classes]
                      assert not missing_cls, f"Missing unobfuscated classes in {t['label']}: {missing_cls}"
                      missing_m = [m for m in ('processUpdateArray', 'sendMessage') if m not in all_strings]
                      assert not missing_m, f"Missing unobfuscated methods in {t['label']}: {missing_m}"
                      assert len(tg_classes) >= 2000, f"Too few Lorg/telegram/* classes ({len(tg_classes)}) in {t['label']}!"
                      print(f"UNOBFUSCATED DEX VERIFICATION PASSED for {t['label']}!")

              sha256 = hashlib.sha256(out_apk.read_bytes()).hexdigest()
              (dist_dir / f"{t['out_name']}.sha256").write_text(f"{sha256}  {t['out_name']}\n", encoding='utf-8')
              size_mib = out_apk.stat().st_size / (1024 * 1024)
              summary.append({
                  'key': t['key'],
                  'label': t['label'],
                  'gradle_task': t['gradle_task'],
                  'package': t['expected_pkg'],
                  'apk_name': t['out_name'],
                  'size': f'{size_mib:.2f} MiB',
                  'apk_version_code': apk_version_code,
                  'dex_tg_classes': len(tg_classes),
                  'sha256': sha256,
                  'cert_sha256': cert_sha256,
              })

          (dist_dir / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print('\n=== Verification Summary ===')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.release_tag }}-${{ steps.meta.outputs.abi_tag }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ABI_FILTERS: ${{ inputs.abi_filters || 'arm64-v8a' }}
          COMMIT_SHA: ${{ steps.ref.outputs.sha }}
          SHORT_SHA: ${{ steps.ref.outputs.short_sha }}
          UNOBFUSCATED: ${{ inputs.unobfuscated }}
        run: |
          set -euo pipefail

          IS_LATEST=$(python3 - <<'PY'
          import os, re, json, subprocess
          cur = int(os.environ['VERSION_CODE'])
          r = subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases?per_page=100"], capture_output=True, text=True)
          max_code = 0
          if r.returncode == 0:
              for rel in json.loads(r.stdout):
                  m = re.search(r'-(\d+)$', rel.get('tag_name', ''))
                  if m:
                      max_code = max(max_code, int(m.group(1)))
          print('true' if cur >= max_code else 'false')
          PY
          )

          python3 - <<'PY'
          import json, os, pathlib

          summary = json.loads(pathlib.Path('dist/summary.json').read_text(encoding='utf-8'))
          version_name = os.environ['VERSION_NAME']
          version_code = os.environ['VERSION_CODE']
          abi_filters = os.environ['ABI_FILTERS']
          commit_sha = os.environ['COMMIT_SHA']
          short_sha = os.environ['SHORT_SHA']
          unobf = os.environ.get('UNOBFUSCATED', 'true').lower() != 'false'
          cert = summary[0]['cert_sha256'] if summary else ''

          lines = [
              f'## Telegram Android {version_name} ({version_code}) — Unobfuscated Release',
              '',
              f'- **Upstream Commit**: [`{short_sha}`](https://github.com/TelegramMessenger/Telegram-Android/commit/{commit_sha})',
              f'- **Version**: `{version_name}` (base code `{version_code}`)',
              f'- **ABI**: `{abi_filters}`',
              f'- **Obfuscation**: {"Disabled (`minifyEnabled=false`, `shrinkResources=false`, DEX unobfuscation verified)" if unobf else "Enabled"}',
              f'- **Debuggable**: `false`',
              f'- **Signing Cert SHA-256**: `{cert}`',
              '',
              '### Artifacts',
              '',
              '| Variant | Package Name | APK File | Size | VersionCode | Unobfuscated DEX Classes | SHA-256 |',
              '| :--- | :--- | :--- | :--- | :--- | :--- | :--- |',
          ]
          for item in summary:
              lines.append(
                  f"| {item['label']} | `{item['package']}` | `{item['apk_name']}` | {item['size']} | `{item['apk_version_code']}` | {item['dex_tg_classes']} | `{item['sha256']}` |"
              )
          pathlib.Path('release_notes.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          ASSETS=(dist/*.apk dist/*.apk.sha256)
          TITLE="Telegram Android ${VERSION_NAME} (${VERSION_CODE}) - Unobfuscated"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading assets and updating notes..."
            gh release upload "${RELEASE_TAG}" "${ASSETS[@]}" --clobber
            if [ "${IS_LATEST}" = "true" ]; then
              gh release edit "${RELEASE_TAG}" --title "${TITLE}" --notes-file release_notes.md --latest
            else
              gh release edit "${RELEASE_TAG}" --title "${TITLE}" --notes-file release_notes.md
            fi
          else
            echo "Creating Release ${RELEASE_TAG} (latest=${IS_LATEST})..."
            gh release create "${RELEASE_TAG}" \
              "${ASSETS[@]}" \
              --target "${COMMIT_SHA}" \
              --title "${TITLE}" \
              --notes-file release_notes.md \
              --latest="${IS_LATEST}"
          fi
